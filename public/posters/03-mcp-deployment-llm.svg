<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1680" viewBox="0 0 1200 1680" role="img" aria-label="MCP Deployment Patterns and LLM Integration">
<rect width="1200" height="1680" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:53px;font-weight:700;fill:#19314B}.sub{font-size:23px;fill:#58697C}.section{font-size:27px;font-weight:700;fill:#19314B}.head{font-size:21px;font-weight:700;fill:#19314B}.body{font-size:19px;fill:#34475A}.small{font-size:16px;fill:#58697C}.tiny{font-size:15px;fill:#58697C}.note{font-size:18px;font-weight:700;fill:#19314B}</style>

<text x="68" y="94" class="title">MCP Deployment Patterns</text>
<text x="70" y="139" class="sub">Host placement · LLM integration · Communication and control</text>
<line x1="68" y1="166" x2="1132" y2="166" stroke="#28638A" stroke-width="3"/>
<rect x="68" y="188" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A"/>
<text x="87" y="217" class="head" text-anchor="middle" style="fill:#FFFFFF">1</text>
<text x="122" y="217" class="section">Keep the roles separate</text>
<rect x="78" y="247" width="1044" height="112" rx="12" fill="#EAF2F8" stroke="#ACC4D4"/>
<text x="100" y="285" class="head">HOST</text>
<text x="243" y="285" class="body">orchestrates and controls</text>
<text x="100" y="326" class="head">MCP CLIENT</text>
<text x="260" y="326" class="body">communicates using MCP</text>
<text x="600" y="326" class="head">MCP SERVER</text>
<text x="774" y="326" class="body">exposes capabilities</text>
<rect x="68" y="377" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A"/>
<text x="87" y="406" class="head" text-anchor="middle" style="fill:#FFFFFF">2</text>
<text x="122" y="406" class="section">Three valid deployment patterns</text>
<rect x="78" y="442" width="1044" height="199" rx="12" fill="#FFFFFF" stroke="#D5E0E7"/>
<text x="101" y="478" class="head">A  ·  Browser-only demonstration</text>
<text x="101" y="508" class="small">Browser runs the Host, MCP client and MCP server</text>
<text x="101" y="533" class="small">in Workers; local MessagePort exchange.</text>
<rect x="101" y="572" width="998" height="47" rx="8" fill="#EAF2F8" stroke="#ACC4D4"/>
<text x="600" y="602" class="note" text-anchor="middle">BROWSER  ·  HOST + CLIENT + SERVER</text>
<rect x="78" y="661" width="1044" height="199" rx="12" fill="#FFFFFF" stroke="#D5E0E7"/>
<text x="101" y="697" class="head">B  ·  Browser Host, remote server</text>
<text x="101" y="727" class="small">Browser runs the Host and MCP client.</text>
<text x="101" y="752" class="small">MCP server is reached via HTTPS over Internet.</text>
<rect x="101" y="791" width="440" height="47" rx="8" fill="#EAF2F8" stroke="#ACC4D4"/>
<text x="321" y="821" class="note" text-anchor="middle">BROWSER  ·  HOST + CLIENT</text>
<text x="577" y="822" class="head" text-anchor="middle" style="fill:#247D7E">→</text>
<rect x="614" y="791" width="485" height="47" rx="8" fill="#ECF6F3" stroke="#B6D6CC"/>
<text x="856" y="821" class="note" text-anchor="middle">REMOTE  ·  MCP SERVER</text>
<rect x="78" y="880" width="1044" height="199" rx="12" fill="#FFFFFF" stroke="#D5E0E7"/>
<text x="101" y="916" class="head">C  ·  Distributed Host</text>
<text x="101" y="946" class="small">Browser supplies UI; a backend orchestrates and runs</text>
<text x="101" y="971" class="small">the MCP client(s). MCP servers may be remote.</text>
<rect x="101" y="1010" width="440" height="47" rx="8" fill="#EAF2F8" stroke="#ACC4D4"/>
<text x="321" y="1040" class="note" text-anchor="middle">BROWSER  ·  UI</text>
<text x="577" y="1041" class="head" text-anchor="middle" style="fill:#247D7E">→</text>
<rect x="614" y="1010" width="485" height="47" rx="8" fill="#ECF6F3" stroke="#B6D6CC"/>
<text x="856" y="1040" class="note" text-anchor="middle">BACKEND  ·  HOST + CLIENT → SERVER</text>
<rect x="68" y="1102" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A"/>
<text x="87" y="1131" class="head" text-anchor="middle" style="fill:#FFFFFF">3</text>
<text x="122" y="1131" class="section">Where a model can fit</text>
<rect x="78" y="1162" width="1044" height="190" rx="12" fill="#F8FBFD" stroke="#D5E0E7"/>
<rect x="100" y="1181" width="310" height="137" rx="12" fill="#FFFFFF" stroke="#D5E0E7"/>
<text x="118" y="1216" class="head">Direct model API</text>
<text x="118" y="1248" class="small">Host uses a provider SDK,</text>
<text x="118" y="1276" class="small">HTTP API, or local inference.</text>
<rect x="444" y="1181" width="310" height="137" rx="12" fill="#FFFFFF" stroke="#D5E0E7"/>
<text x="462" y="1216" class="head">LLM behind MCP</text>
<text x="462" y="1248" class="small">MCP server exposes an inference</text>
<text x="462" y="1276" class="small">tool; model API is downstream.</text>
<rect x="788" y="1181" width="310" height="137" rx="12" fill="#FFFFFF" stroke="#D5E0E7"/>
<text x="806" y="1216" class="head">Manual interaction</text>
<text x="806" y="1248" class="small">User exchanges content with a</text>
<text x="806" y="1276" class="small">chatbot; no automated coupling.</text>
<rect x="68" y="1369" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A"/>
<text x="87" y="1398" class="head" text-anchor="middle" style="fill:#FFFFFF">4</text>
<text x="122" y="1398" class="section">What stays under application control</text>
<text x="85" y="1440" class="body">Tool selection  ·  Permissions  ·  Consent  ·  Context  ·  Provenance</text>
<rect x="78" y="1463" width="1044" height="68" rx="12" fill="#ECF6F3" stroke="#B6D6CC"/>
<text x="101" y="1491" class="note">Neither MCP nor an LLM API requires a particular Host deployment.</text>
<text x="101" y="1518" class="small">A browser Host is possible; secure credentials and CORS still matter.</text>
<line x1="78" y1="1550" x2="1122" y2="1550" stroke="#D5E0E7" stroke-width="2"/>
<a href="https://modelcontextprotocol.io/specification/2026-07-28/architecture" target="_blank">
<text x="82" y="1579" class="small" style="fill:#28638A">MCP architecture</text>
</a>
<a href="https://modelcontextprotocol.io/specification/2026-07-28/server/tools" target="_blank">
<text x="270" y="1579" class="small" style="fill:#28638A">MCP tools</text>
</a>
<text x="68" y="1628" class="small">AI &amp; Interoperable Systems Atlas  ·  Visual reference  ·  October 2026</text>
<text x="1116" y="1628" class="small" text-anchor="end">3 / 3</text>
</svg>