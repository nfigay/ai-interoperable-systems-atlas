<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1680" viewBox="0 0 1200 1680" role="img" aria-label="MCP 2026-07-28">
<rect width="1200" height="1680" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:55px;font-weight:700;fill:#19314B}.sub{font-size:23px;fill:#58697C}.section{font-size:27px;font-weight:700;fill:#19314B}.head{font-size:21px;font-weight:700;fill:#19314B}.body{font-size:19px;fill:#34475A}.small{font-size:16px;fill:#58697C}.mono{font-family:monospace;font-size:18px;fill:#28638A}</style>
<text x="68" y="94" class="title">MCP 2026-07-28</text>
<text x="70" y="139" class="sub">What changed from 2025-11-25 · Compatibility · Implementation impact</text>
<line x1="68" y1="166" x2="1132" y2="166" stroke="#28638A" stroke-width="3"/>
<text x="68" y="1628" class="small">AI &amp; Interoperable Systems Atlas  ·  Visual reference  ·  October 2026</text>
<text x="1116" y="1628" class="small" text-anchor="end">2 / 2</text>
<rect x="68" y="189" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="87" y="217" class="head" text-anchor="middle" style="fill:#FFFFFF">1</text>
<text x="122" y="217" class="section">What matters most</text>
<rect x="78" y="247" width="1044" height="94" rx="14" fill="#EAF2F8" stroke="#ACC4D4" stroke-width="1"/>
<text x="102" y="286" class="head">From a connection-oriented handshake to self-contained requests.</text>
<text x="102" y="316" class="small">Changes affect message structure and lifecycle, not the purpose of MCP tools.</text>
<rect x="68" y="365" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="87" y="393" class="head" text-anchor="middle" style="fill:#FFFFFF">2</text>
<text x="122" y="393" class="section">Protocol comparison</text>
<rect x="78" y="427" width="503" height="57" rx="7" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="100" y="464" class="head" style="fill:#FFFFFF">2025-11-25 · LEGACY</text>
<rect x="594" y="427" width="528" height="57" rx="7" fill="#247D7E" stroke="#247D7E" stroke-width="1"/>
<text x="615" y="464" class="head" style="fill:#FFFFFF">2026-07-28 · MODERN</text>
<rect x="78" y="493" width="1044" height="86" rx="8" fill="#F3F7FA" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="526" class="body">initialize / initialized</text>
<text x="100" y="552" class="body">handshake</text>
<text x="583" y="544" class="head" text-anchor="middle">→</text>
<text x="615" y="526" class="body">No initial handshake;</text>
<text x="615" y="552" class="body">requests carry _meta</text>
<rect x="78" y="585" width="1044" height="86" rx="8" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="618" class="body">Capability agreement</text>
<text x="100" y="644" class="body">at initialization</text>
<text x="583" y="636" class="head" text-anchor="middle">→</text>
<text x="615" y="618" class="body">Protocol version + client</text>
<text x="615" y="644" class="body">capabilities on each request</text>
<rect x="78" y="677" width="1044" height="86" rx="8" fill="#F3F7FA" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="710" class="body">Protocol-level sessions</text>
<text x="583" y="728" class="head" text-anchor="middle">→</text>
<text x="615" y="710" class="body">No protocol-level sessions;</text>
<text x="615" y="736" class="body">explicit handles if state needed</text>
<rect x="78" y="769" width="1044" height="86" rx="8" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="802" class="body">Established connection</text>
<text x="100" y="828" class="body">for normal operation</text>
<text x="583" y="820" class="head" text-anchor="middle">→</text>
<text x="615" y="802" class="body">server/discover available;</text>
<text x="615" y="828" class="body">optional for clients</text>
<rect x="78" y="861" width="1044" height="86" rx="8" fill="#F3F7FA" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="894" class="body">Older result formats</text>
<text x="583" y="912" class="head" text-anchor="middle">→</text>
<text x="615" y="894" class="body">resultType required on</text>
<text x="615" y="920" class="body">every result</text>
<rect x="78" y="953" width="1044" height="86" rx="8" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="986" class="body">Server-initiated requests</text>
<text x="583" y="1004" class="head" text-anchor="middle">→</text>
<text x="615" y="986" class="body">MRTR: input_required</text>
<text x="615" y="1012" class="body">and retry with inputResponses</text>
<rect x="78" y="1045" width="1044" height="86" rx="8" fill="#F3F7FA" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="1078" class="body">Older subscription model</text>
<text x="583" y="1096" class="head" text-anchor="middle">→</text>
<text x="615" y="1078" class="body">subscriptions/listen;</text>
<text x="615" y="1104" class="body">revised HTTP streaming</text>
<rect x="78" y="1137" width="1044" height="86" rx="8" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1"/>
<text x="100" y="1170" class="body">Tasks in core / experimental</text>
<text x="583" y="1188" class="head" text-anchor="middle">→</text>
<text x="615" y="1170" class="body">Tasks now in extension;</text>
<text x="615" y="1196" class="body">cache metadata added</text>
<rect x="68" y="1283" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="87" y="1311" class="head" text-anchor="middle" style="fill:#FFFFFF">3</text>
<text x="122" y="1311" class="section">What changes in an implementation?</text>
<text x="82" y="1348" class="head">SDK</text>
<text x="278" y="1348" class="small">One SDK may support both eras; configure negotiation.</text>
<text x="82" y="1397" class="head">Wire protocol</text>
<text x="278" y="1397" class="small">Do not assume a legacy client works with a modern-only server.</text>
<text x="82" y="1446" class="head">Transports</text>
<text x="278" y="1446" class="small">Check HTTP / custom transport behavior and metadata.</text>
<text x="82" y="1495" class="head">Business logic</text>
<text x="278" y="1495" class="small">Tool implementation often remains reusable.</text>
<line x1="78" y1="1552" x2="1122" y2="1552" stroke="#D5E0E7" stroke-width="2"/>
<a href="https://modelcontextprotocol.io/specification/2026-07-28/changelog" target="_blank"><text x="82" y="1581" class="small" fill="#28638A" text-decoration="underline">Official changelog</text></a>
<a href="https://ts.sdk.modelcontextprotocol.io/v2/protocol-versions" target="_blank"><text x="312" y="1581" class="small" fill="#28638A" text-decoration="underline">TypeScript SDK protocol versions</text></a>
</svg>