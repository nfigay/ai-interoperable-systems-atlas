<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1680" viewBox="0 0 1200 1680" role="img" aria-label="MCP in Practice">
<rect width="1200" height="1680" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:55px;font-weight:700;fill:#19314B}.sub{font-size:23px;fill:#58697C}.section{font-size:27px;font-weight:700;fill:#19314B}.head{font-size:21px;font-weight:700;fill:#19314B}.body{font-size:19px;fill:#34475A}.small{font-size:16px;fill:#58697C}.mono{font-family:monospace;font-size:18px;fill:#28638A}</style>
<text x="68" y="94" class="title">MCP in Practice</text>
<text x="70" y="139" class="sub">What MCP standardizes · The three roles · Optional LLM · Tool governance</text>
<line x1="68" y1="166" x2="1132" y2="166" stroke="#28638A" stroke-width="3"/>
<text x="68" y="1628" class="small">AI &amp; Interoperable Systems Atlas  ·  Visual reference  ·  October 2026</text>
<text x="1116" y="1628" class="small" text-anchor="end">1 / 2</text>
<rect x="68" y="189" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="87" y="217" class="head" text-anchor="middle" style="fill:#FFFFFF">1</text>
<text x="122" y="217" class="section">What MCP is</text>
<text x="80" y="267" class="body">MCP standardizes how applications discover and invoke external capabilities.</text>
<text x="80" y="296" class="body">It uses JSON-RPC. It does not prescribe an LLM, a UI, or a deployment topology.</text>
<rect x="68" y="326" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="87" y="354" class="head" text-anchor="middle" style="fill:#FFFFFF">2</text>
<text x="122" y="354" class="section">Architecture: the three MCP roles</text>
<rect x="78" y="390" width="694" height="444" rx="14" fill="#EAF2F8" stroke="#ACC4D4" stroke-width="1"/>
<text x="102" y="427" class="head">HOST  ·  application / orchestrator</text>
<text x="102" y="463" class="body">Manages connections, context and application policy.</text>
<text x="102" y="492" class="body">May integrate a model; may work without one.</text>
<rect x="111" y="538" width="292" height="120" rx="14" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1"/>
<text x="131" y="576" class="head">MCP CLIENT A</text>
<text x="131" y="607" class="small">Protocol endpoint for A</text>
<rect x="450" y="538" width="292" height="120" rx="14" fill="#FFFFFF" stroke="#D5E0E7" stroke-width="1"/>
<text x="470" y="576" class="head">MCP CLIENT B</text>
<text x="470" y="607" class="small">Protocol endpoint for B</text>
<rect x="111" y="692" width="631" height="113" rx="14" fill="#F8FBFD" stroke="#D5E0E7" stroke-width="1"/>
<text x="132" y="730" class="head">Optional LLM / model API</text>
<text x="132" y="761" class="small">The host may consult a model to propose an action.</text>
<rect x="92" y="865" width="300" height="123" rx="14" fill="#ECF6F3" stroke="#B6D6CC" stroke-width="1"/>
<text x="112" y="903" class="head">MCP SERVER A</text>
<text x="112" y="938" class="small">Tools · Resources · Prompts</text>
<rect x="458" y="865" width="300" height="123" rx="14" fill="#ECF6F3" stroke="#B6D6CC" stroke-width="1"/>
<text x="478" y="903" class="head">MCP SERVER B</text>
<text x="478" y="938" class="small">Tools · Resources · Prompts</text>
<line x1="253" y1="833" x2="253" y2="862" stroke="#247D7E" stroke-width="3"/>
<polygon points="253,862 247,851 259,851" fill="#247D7E"/>
<line x1="596" y1="833" x2="596" y2="862" stroke="#247D7E" stroke-width="3"/>
<polygon points="596,862 590,851 602,851" fill="#247D7E"/>
<text x="811" y="425" class="head">Boundaries</text>
<text x="811" y="465" class="body">1 host can manage</text>
<text x="811" y="496" class="body">multiple MCP clients.</text>
<text x="811" y="527" class="body"></text>
<text x="811" y="558" class="body">Each client connects</text>
<text x="811" y="589" class="body">to one MCP server.</text>
<text x="811" y="620" class="body"></text>
<text x="811" y="651" class="body">Servers may call</text>
<text x="811" y="682" class="body">external systems using</text>
<text x="811" y="713" class="body">any technology.</text>
<line x1="808" y1="752" x2="1120" y2="752" stroke="#D5E0E7" stroke-width="2"/>
<text x="811" y="800" class="head">MCP is client ↔ server,</text>
<text x="811" y="832" class="head">not host ↔ LLM.</text>
<rect x="68" y="1036" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="87" y="1064" class="head" text-anchor="middle" style="fill:#FFFFFF">3</text>
<text x="122" y="1064" class="section">How an MCP tool is invoked</text>
<rect x="78" y="1100" width="336" height="93" rx="14" fill="#F3F7FA" stroke="#D5E0E7" stroke-width="1"/>
<text x="97" y="1136" class="head">USER</text>
<text x="97" y="1168" class="small">Explicit UI action</text>
<rect x="444" y="1100" width="336" height="93" rx="14" fill="#F3F7FA" stroke="#D5E0E7" stroke-width="1"/>
<text x="463" y="1136" class="head">WORKFLOW</text>
<text x="463" y="1168" class="small">Deterministic rule</text>
<rect x="810" y="1100" width="336" height="93" rx="14" fill="#F3F7FA" stroke="#D5E0E7" stroke-width="1"/>
<text x="829" y="1136" class="head">LLM</text>
<text x="829" y="1168" class="small">Proposes an action</text>
<line x1="603" y1="1203" x2="603" y2="1252" stroke="#247D7E" stroke-width="3"/>
<polygon points="603,1252 597,1241 609,1241" fill="#247D7E"/>
<rect x="150" y="1258" width="898" height="103" rx="14" fill="#EAF2F8" stroke="#ACC4D4" stroke-width="1"/>
<text x="176" y="1300" class="head">HOST DECISION</text>
<text x="176" y="1333" class="body">Available tools · policy · argument validation · approval when needed</text>
<line x1="603" y1="1364" x2="603" y2="1401" stroke="#247D7E" stroke-width="3"/>
<polygon points="603,1401 597,1390 609,1390" fill="#247D7E"/>
<rect x="150" y="1407" width="898" height="74" rx="14" fill="#ECF6F3" stroke="#B6D6CC" stroke-width="1"/>
<text x="176" y="1452" class="head">MCP client → MCP server → execution and result</text>
<rect x="68" y="1494" width="39" height="39" rx="9" fill="#28638A" stroke="#28638A" stroke-width="1"/>
<text x="87" y="1522" class="head" text-anchor="middle" style="fill:#FFFFFF">4</text>
<text x="122" y="1522" class="section">Key principle</text>
<text x="82" y="1566" class="head">A model proposal is not an authorization decision.</text>
<a href="https://modelcontextprotocol.io/specification/2026-07-28/architecture" target="_blank"><text x="82" y="1601" class="small" fill="#28638A" text-decoration="underline">Spec: architecture</text></a>
<a href="https://modelcontextprotocol.io/specification/2026-07-28/server/tools" target="_blank"><text x="309" y="1601" class="small" fill="#28638A" text-decoration="underline">Spec: tools</text></a>
</svg>